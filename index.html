<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoodDash QMS – Team 9</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#d9480f;--ok:#2b8a3e;--wa:#e8590c;--er:#c92a2a;--bl:#1c7ed6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161615;--card:#212120;--tx:#f0efe9;--mu:#a3a29a;--bd:#34332f;--ac:#ff8c5a;--ok:#51cf66;--wa:#ffa94d;--er:#ff6b6b;--bl:#74c0fc;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px 0}h1{font-size:18px;margin:0}header p{margin:2px 0 8px;color:var(--mu);font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;background:none;color:var(--mu);padding:7px 11px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
main{padding:14px;max-width:1100px;margin:auto}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.k b{display:block;font-size:24px}.k span{color:var(--mu);font-size:12px}
h2{font-size:15px;margin:0 0 8px}h3{font-size:13px;margin:10px 0 4px;color:var(--mu)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600;white-space:nowrap}
.t{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;color:#fff;background:var(--mu)}
.ok{background:var(--ok)}.er{background:var(--er)}.wa{background:var(--wa)}.bl{background:var(--bl)}
button.b,select,input{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 9px}
button.b{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac)}button.s{background:var(--card);color:var(--tx);border-color:var(--bd)}
.bar{height:14px;background:var(--ac);border-radius:4px;min-width:2px}.row{display:flex;align-items:center;gap:8px;margin:4px 0}.row span:first-child{width:120px;font-size:12px}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.m{color:var(--mu);font-size:12px}
.st{display:flex;gap:2px;flex-wrap:wrap}.st i{font-style:normal;font-size:11px;padding:2px 7px;border:1px solid var(--bd);border-radius:6px;color:var(--mu)}.st i.d{background:var(--ok);color:#fff;border-color:var(--ok)}.st i.n{border-color:var(--ac);color:var(--ac);font-weight:700}
.hero{background:linear-gradient(120deg,#7048e8,#d9480f 62%,#f08c00);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.hero h2{font-size:21px;margin:0 0 6px;color:#fff}.hero .big{font-size:46px;font-weight:800;line-height:1}.pill{background:rgba(255,255,255,.22);padding:4px 12px;border-radius:99px;font-weight:700;display:inline-block;margin:0 6px 4px 0;font-size:12px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g2 .c{margin:0}.ctr{display:flex;flex-direction:column;align-items:center;text-align:center}.sp{display:flex;justify-content:space-between;align-items:baseline}.sp b{font-size:26px}.dl{color:var(--ok);font-size:12px;font-weight:700}.heat{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px}.heat div{border-radius:10px;padding:8px;font-size:11px;border:1px solid var(--bd)}.heat b{display:block;font-size:20px}.pg{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;border-radius:9px}.rk{padding:6px 10px;border-radius:8px;margin:4px 0;font-size:13px;border-left:4px solid var(--er);background:color-mix(in srgb,var(--er) 9%,var(--card))}.rk.wa{border-color:var(--wa);background:color-mix(in srgb,var(--wa) 9%,var(--card))}.c{box-shadow:0 1px 3px rgba(0,0,0,.06)}
</style></head><body>
<header><h1>FoodDash QMS – Quality Management System</h1><p>Team 9 · Food Delivery Software · prototype (data held in memory, resets on reload)</p></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const TABS=["Executive View","Dashboard","Quality Plan","Reviews","Integration","Defects","Config Control","Metrics","CAPA & Improvement"];
let tab=0;
const ST=["Identified","Classified","Assigned","Corrected","Verified","Closed"];
const SH=["Customer","Restaurant","Delivery","Admin","Payment","QA/Dev"];
const SV=["Critical","Major","Minor","Cosmetic"];
const IM=["Wrong order/payment data","Order delayed/blocked","No order impact"];
const COMP=["Customer App","Restaurant Portal","Order Service","Payment","Delivery Assign","Tracking","Notifications"];
const CAUSE=["Requirement ambiguity","Interface mismatch","Missing test","Coding error","Config/environment"];
const SLA=["4 h","24 h","3 days","Next release"];
let D=[
{id:1,t:"Order shows wrong item quantity after menu update",c:"Order Service",s:1,i:0,k:"Interface mismatch",st:2,o:"Anil"},
{id:2,t:"Customer charged twice on retry",c:"Payment",s:1,i:0,k:"Missing test",st:3,o:"Divya"},
{id:3,t:"Rider assigned to cancelled order",c:"Delivery Assign",s:2,i:1,k:"Interface mismatch",st:1,o:""},
{id:4,t:"Price in cart differs from restaurant menu",c:"Customer App",s:2,i:0,k:"Requirement ambiguity",st:4,o:"Ravi"},
{id:5,t:"Tracking map freezes on slow network",c:"Tracking",s:3,i:1,k:"Coding error",st:0,o:""},
{id:6,t:"SMS sent twice on order confirmation",c:"Notifications",s:3,i:2,k:"Interface mismatch",st:5,o:"Meena"},
{id:7,t:"Wrong delivery address on reorder",c:"Order Service",s:2,i:0,k:"Requirement ambiguity",st:5,o:"Anil"},
{id:8,t:"Typo in restaurant portal header",c:"Restaurant Portal",s:4,i:2,k:"Coding error",st:5,o:"Ravi"}];
let R=[
{id:"REQ-12",t:"Customer can modify order before restaurant accepts",a:[1,1,1,1,1,1]},
{id:"REQ-13",t:"Refund on restaurant cancellation",a:[1,2,0,1,1,1]},
{id:"REQ-14",t:"Auto-assign nearest rider within 2 min",a:[1,1,1,0,0,1]},
{id:"REQ-15",t:"Live tracking refresh every 10 s",a:[1,0,1,1,0,1]}];
let RV=[
{ty:"Requirements",a:"SRS v1.3",f:9,m:3,d:1},{ty:"Design",a:"Order-Payment design v1.1",f:6,m:2,d:1},
{ty:"Code",a:"Order Service PR #84",f:11,m:2,d:1},{ty:"Test",a:"Regression suite v2.0",f:4,m:1,d:0},{ty:"Release",a:"Release 2.4.0",f:0,m:0,d:0}];
let IF=[
{n:"Customer App ⇄ Order Service",ctl:"Contract test, schema validation",p:1},
{n:"Order Service ⇄ Payment",ctl:"Idempotency key test, sandbox E2E",p:1},
{n:"Order Service ⇄ Restaurant Portal",ctl:"Contract test, menu version check",p:1},
{n:"Order Service ⇄ Delivery Assign",ctl:"State-transition test (cancelled/assigned)",p:0},
{n:"Order Service ⇄ Notifications",ctl:"Event dedup test",p:1}];
let CF=[
{n:"SRS",v:1.3,s:"Baselined"},{n:"Architecture & API spec",v:2.1,s:"Baselined"},{n:"Test plan",v:1.2,s:"Approved"},
{n:"Order Service source",v:"2.4.0-rc1",s:"Under change"},{n:"Regression suite",v:2.0,s:"Approved"},{n:"Release notes",v:"2.4.0",s:"Draft"}];
let CH=["SRS 1.2→1.3: REQ-13 refund rule added (CR-07, approved by Restaurant+Payment)"];
const CP_ST=["Problem","Root cause","Corrective","Preventive","Verification","Improvement"];
let CA=[{p:"Wrong order data reaching restaurants",rc:"Order and Menu APIs changed without joint contract test (5-why)",ca:"Hotfix mapping bug; backfill affected orders",pa:"Mandatory consumer-driven contract tests in CI",vf:"",im:"",st:2}];
let regr=94,cov=71;

const pri=d=>d.i==0?1:Math.max(1,Math.min(4,d.s+d.i-1));
const PL=["","P1","P2","P3","P4"],PC=["","er","wa","bl",""];
const open=d=>d.st<5;
const tag=(t,c)=>`<span class="t ${c||""}">${t}</span>`;
function M(){
 const n=D.length,cl=D.filter(d=>!open(d)).length,op=D.filter(open);
 const ord=D.filter(d=>d.i==0).length;
 const rvd=RV.reduce((a,r)=>a+r.f,0),esc=D.filter(d=>d.c).length;
 const dre=Math.round(rvd/(rvd+n)*100);
 const baseApproved=R.filter(r=>r.a.every(x=>x==1)).length;
 return{n,op,cl,ord,dre,baseApproved,p1:op.filter(d=>pri(d)==1).length,p12:op.filter(d=>pri(d)<=2).length,
  ip:Math.round(IF.filter(x=>x.p).length/IF.length*100),rv:Math.round(RV.filter(r=>r.d).length/RV.length*100),
  capa:CA.filter(c=>c.st==5).length+"/"+CA.length,dd:(n/12).toFixed(2)}}
function gate(){const m=M();return[
 ["All requirements approved by all stakeholders (baselined)",m.baseApproved==R.length],
 ["No open P1/P2 defects",m.p12==0],
 ["All interface contract tests pass",m.ip==100],
 ["All planned reviews completed (req, design, code, test, release)",m.rv==100],
 ["Regression pass rate ≥ 95% (now "+regr+"%)",regr>=95],
 ["Code coverage ≥ 75% (now "+cov+"%)",cov>=75]]}
const T=[
 EXEC,
 ()=>{const m=M(),g=gate(),ok=g.every(x=>x[1]);
  const by={};D.filter(open).forEach(d=>by[d.c]=(by[d.c]||0)+1);
  return`<div class="g">
  ${[["Open defects",m.op.length],["Open P1/P2",m.p12],["Order-data defects",m.ord],["Defect removal eff.",m.dre+"%"],["Interface tests passing",m.ip+"%"],["Review completion",m.rv+"%"],["CAPA closed",m.capa]].map(x=>`<div class="c k"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>
  <div class="c"><h2>Release 2.4.0 gate ${ok?tag("GO","ok"):tag("NO-GO","er")}</h2>
  ${g.map(x=>`<div>${x[1]?"✅":"❌"} ${x[0]}</div>`).join("")}
  <div class="f" style="margin-top:8px"><label class="m">Regression % <input type="number" value="${regr}" style="width:70px" onchange="regr=+this.value;go()"></label><label class="m">Coverage % <input type="number" value="${cov}" style="width:70px" onchange="cov=+this.value;go()"></label></div></div>
  <div class="c"><h2>Open defects by component</h2>${Object.entries(by).map(([k,v])=>`<div class="row"><span>${k}</span><div class="bar" style="width:${v*60}px"></div><span>${v}</span></div>`).join("")||"None"}</div>
  <div class="c m">Answers the core question: plan → control (gates, reviews, change control) → measure (metrics) → improve (CAPA), all driven from live defect, review and test data.</div>`},
 ()=>`<div class="c"><h2>Quality objectives</h2><div class="w"><table><tr><th>Objective</th><th>Target</th><th>Criterion</th></tr>
 <tr><td>Zero wrong-order releases</td><td>0 open P1 at release</td><td>No incorrect item/price/address/charge</td></tr>
 <tr><td>Early defect detection</td><td>DRE ≥ 85%</td><td>Found in review/test, not production</td></tr>
 <tr><td>Stable integrations</td><td>100% contract tests pass</td><td>All 5 interfaces verified per release</td></tr>
 <tr><td>Requirement consistency</td><td>100% stakeholder sign-off</td><td>Baseline only when all approve</td></tr>
 <tr><td>Reliable frequent releases</td><td>Regression ≥ 95%, coverage ≥ 75%</td><td>Automated gate per release</td></tr></table></div></div>
 <div class="c"><h2>Roles</h2><div class="w"><table><tr><th>Role</th><th>Responsibility</th></tr>
 <tr><td>QA Manager</td><td>Owns QMS, quality plan, gate decisions, audits</td></tr>
 <tr><td>Product Owner</td><td>Collects stakeholder needs, resolves conflicts</td></tr>
 <tr><td>Tech Lead</td><td>Design/code review, interface contracts</td></tr>
 <tr><td>QA Engineer</td><td>Test design, regression, defect verification</td></tr>
 <tr><td>Config Manager</td><td>Baselines, version and change control</td></tr>
 <tr><td>Release Manager</td><td>Release verification, rollback readiness</td></tr></table></div></div>
 <div class="c"><h2>Stage entry / exit criteria</h2><div class="w"><table><tr><th>Stage</th><th>Entry</th><th>Exit</th><th>Verification</th></tr>
 <tr><td>Requirements</td><td>Stakeholder inputs collected</td><td>All 6 stakeholders signed, baselined</td><td>Requirements review</td></tr>
 <tr><td>Design</td><td>Baselined SRS</td><td>API contracts defined, no open major design findings</td><td>Design review</td></tr>
 <tr><td>Coding</td><td>Approved design</td><td>PR reviewed, unit tests pass, coverage ≥ 75%</td><td>Code review + CI</td></tr>
 <tr><td>Testing</td><td>Build in test env, test plan approved</td><td>Regression ≥ 95%, contract tests 100%, no P1/P2</td><td>Test review</td></tr>
 <tr><td>Release</td><td>Test exit met</td><td>Gate GO, rollback plan, release notes</td><td>Release verification</td></tr>
 <tr><td>Maintenance</td><td>Production monitoring</td><td>Hotfix: P1 verified in 4 h</td><td>Defect + CAPA</td></tr></table></div></div>
 <div class="c"><h2>Standard process template</h2><div class="m">Inputs → Entry criteria → Activities → Outputs → Exit criteria → Verification points → Measurements. Frequent releases: every sprint release runs the same lightweight gate; the checks are automated where possible (CI contract tests, regression).</div></div>`,
 ()=>`<div class="c"><h2>Multi-stakeholder requirements review</h2><div class="m">Click a cell: Pending → Approved → Objection. A requirement is baselined only when every stakeholder approves; objections go to the Product Owner for resolution.</div><div class="w"><table><tr><th>Req</th><th>Description</th>${SH.map(s=>`<th>${s}</th>`).join("")}<th>Status</th></tr>
 ${R.map((r,i)=>`<tr><td>${r.id}</td><td>${r.t}</td>${r.a.map((x,j)=>`<td><button class="b s" onclick="R[${i}].a[${j}]=(R[${i}].a[${j}]+1)%3;go()">${["⏳","✔","✖"][x]}</button></td>`).join("")}<td>${r.a.every(x=>x==1)?tag("Baselined","ok"):r.a.includes(2)?tag("Conflict","er"):tag("In review","wa")}</td></tr>`).join("")}</table></div></div>
 <div class="c"><h2>Review log</h2><div class="w"><table><tr><th>Type</th><th>Artifact</th><th>Findings</th><th>Major</th><th>Status</th></tr>
 ${RV.map((r,i)=>`<tr><td>${r.ty}</td><td>${r.a}</td><td>${r.f}</td><td>${r.m}</td><td><button class="b s" onclick="RV[${i}].d^=1;go()">${r.d?"✅ Done":"Mark done"}</button></td></tr>`).join("")}</table></div></div>
 <div class="c"><h2>Checklists</h2><div class="m"><b>Requirements:</b> testable · unambiguous · no stakeholder conflict · order/payment rules explicit · traceable ID.<br><b>Design:</b> interface contract defined · error/retry/idempotency handled · data ownership clear.<br><b>Code:</b> standards · input validation · unit tests · no hard-coded prices · peer approved.<br><b>Test:</b> covers requirements (traceability) · negative paths · order-state transitions.<br><b>Release:</b> gate GO · rollback plan · release notes · monitoring ready.</div></div>`,
 ()=>`<div class="c"><h2>Integration quality controls</h2><div class="m">Click status to toggle contract-test result. Failing interface blocks the release gate.</div><div class="w"><table><tr><th>Interface</th><th>Control</th><th>Contract test</th></tr>
 ${IF.map((x,i)=>`<tr><td>${x.n}</td><td>${x.ctl}</td><td><button class="b s" onclick="IF[${i}].p^=1;go()">${x.p?tag("PASS","ok"):tag("FAIL","er")}</button></td></tr>`).join("")}</table></div></div>
 <div class="c"><h2>Standing controls</h2><div class="m">• Versioned API contracts; breaking changes need change request + all consumers notified.<br>• Consumer-driven contract tests run in CI on every merge.<br>• End-to-end order scenarios (place → pay → accept → assign → deliver → notify) in staging before every release.<br>• Order data reconciliation check between Customer App, Restaurant Portal and Order Service.</div></div>`,
 ()=>`<div class="c"><h2>Log defect</h2><div class="f">
 <input id="dt" placeholder="Title" style="flex:1;min-width:160px"><select id="dc">${COMP.map(x=>`<option>${x}</option>`).join("")}</select>
 <select id="ds">${SV.map((x,i)=>`<option value="${i+1}">${x}</option>`).join("")}</select>
 <select id="di">${IM.map((x,i)=>`<option value="${i}">${x}</option>`).join("")}</select>
 <select id="dk">${CAUSE.map(x=>`<option>${x}</option>`).join("")}</select><button class="b" onclick="addD()">Add</button></div>
 <div class="m">Priority rule: wrong order/payment data = always P1. Otherwise priority = severity adjusted by order impact. SLA: P1 4 h · P2 24 h · P3 3 days · P4 next release.</div></div>
 <div class="c"><div class="w"><table><tr><th>#</th><th>Defect</th><th>Component</th><th>Sev</th><th>Order impact</th><th>Pri / SLA</th><th>Workflow</th><th></th></tr>
 ${[...D].sort((a,b)=>pri(a)-pri(b)).map(d=>`<tr><td>${d.id}</td><td>${d.t}<div class="m">Cause: ${d.k}${d.o?" · Owner: "+d.o:""}</div></td><td>${d.c}</td><td>${SV[d.s-1]}</td><td>${IM[d.i]}</td><td>${tag(PL[pri(d)],PC[pri(d)])}<div class="m">${SLA[pri(d)-1]}</div></td>
 <td><div class="st">${ST.map((s,j)=>`<i class="${j<d.st?"d":j==d.st?"n":""}">${s}</i>`).join("")}</div></td>
 <td>${d.st<5?`<button class="b" onclick="adv(${d.id})">→ ${ST[d.st+1]}</button>`:""}</td></tr>`).join("")}</table></div></div>`,
 ()=>`<div class="c"><h2>Document and artifact control</h2><div class="w"><table><tr><th>Artifact</th><th>Version</th><th>Status</th><th></th></tr>
 ${CF.map((x,i)=>`<tr><td>${x.n}</td><td>${x.v}</td><td>${tag(x.s,x.s=="Baselined"?"ok":x.s=="Under change"?"wa":"bl")}</td><td><button class="b s" onclick="chg(${i})">Raise change request</button></td></tr>`).join("")}</table></div></div>
 <div class="c"><h2>Change log</h2>${CH.map(x=>`<div>• ${x}</div>`).join("")}<div class="m" style="margin-top:6px">Rules: only baselined items change through approved CR · every release tags source, tests, SRS and notes together · rollback to the last tagged baseline.</div></div>`,
 ()=>{const m=M();return`<div class="c"><h2>Metrics management should monitor</h2><div class="w"><table><tr><th>Metric</th><th>Now</th><th>Target</th><th>Why for food delivery</th></tr>
 <tr><td>Order-data defect count</td><td>${m.ord}</td><td>0 open</td><td>Wrong item/price/address directly costs money and customer trust</td></tr>
 <tr><td>Defect removal efficiency</td><td>${m.dre}%</td><td>≥ 85%</td><td>Late detection was the stated problem</td></tr>
 <tr><td>Defect density (per release unit)</td><td>${m.dd}</td><td>↓ trend</td><td>Shows quality per frequent release</td></tr>
 <tr><td>Open P1/P2</td><td>${m.p12}</td><td>0 at release</td><td>Gate input; ordering outages are peak-time critical</td></tr>
 <tr><td>Interface test pass rate</td><td>${m.ip}%</td><td>100%</td><td>Many interacting components</td></tr>
 <tr><td>Review completion</td><td>${m.rv}%</td><td>100%</td><td>Prevents inconsistent requirements</td></tr>
 <tr><td>Requirements baselined</td><td>${m.baseApproved}/${R.length}</td><td>100%</td><td>Multi-stakeholder agreement</td></tr>
 <tr><td>Regression pass / coverage</td><td>${regr}% / ${cov}%</td><td>95% / 75%</td><td>Safe frequent releases</td></tr>
 <tr><td>Recurring defect rate</td><td>${rec().length} cause(s)</td><td>0</td><td>Measures prevention effectiveness</td></tr>
 <tr><td>CAPA closed</td><td>${m.capa}</td><td>100%</td><td>Proof the process improves</td></tr></table></div></div>`},
 ()=>{const rc=rec();const cnt={};D.forEach(d=>cnt[d.k]=(cnt[d.k]||0)+1);
 return`<div class="c"><h2>Recurring defect analysis (Pareto by root cause)</h2>
 ${Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span style="width:170px">${k}</span><div class="bar" style="width:${v*50}px"></div><span>${v}</span>${v>=2&&!CA.some(c=>c.cat==k)?`<button class="b s" onclick="mk('${k}')">Open CAPA</button>`:""}</div>`).join("")}
 <div class="m">Rule: same root cause in 2 or more defects = recurring → CAPA required.</div></div>
 ${CA.map((c,i)=>`<div class="c"><h2>CAPA-${i+1}: ${c.p}</h2><div class="st">${CP_ST.map((s,j)=>`<i class="${j<c.st?"d":j==c.st?"n":""}">${s}</i>`).join("")}</div>
 <div class="m" style="margin-top:6px">Root cause: ${c.rc||"–"}<br>Corrective: ${c.ca||"–"}<br>Preventive: ${c.pa||"–"}<br>Verification: ${c.vf||"–"}<br>Improvement: ${c.im||"–"}</div>
 ${c.st<5?`<button class="b" style="margin-top:6px" onclick="nx(${i})">Complete stage → ${CP_ST[c.st+1]}</button>`:tag("Closed","ok")}</div>`).join("")}
 <div class="c"><h2>Continuous improvement log</h2><div class="m">• Contract tests added to CI after order-data defects → target: zero interface-caused P1.<br>• Stakeholder sign-off matrix introduced after requirement conflicts → baseline only on full approval.<br>• Idempotency test mandatory for Payment after double-charge defect.<br>Review the Metrics tab each release retrospective; if a metric misses target 2 releases running, update the process template.</div></div>`}];
const col=p=>p>=90?"var(--ok)":p>=70?"var(--wa)":"var(--er)";
function ring(p,c,l){const C=2*Math.PI*52;return`<svg viewBox="0 0 130 130" width="125"><circle cx="65" cy="65" r="52" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="65" cy="65" r="52" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 65 65)"/><text x="65" y="68" text-anchor="middle" font-size="28" font-weight="700" fill="currentColor">${p}%</text></svg><div class="m">${l}</div>`}
function line(a,c){const mx=Math.max(...a)*1.2||1,p=a.map((v,i)=>[i*300/(a.length-1),95-v/mx*85]),d=p.map(x=>x.join(",")).join(" ");return`<svg viewBox="0 0 300 100" width="100%"><polygon points="0,100 ${d} 300,100" fill="${c}" opacity=".15"/><polyline points="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>${p.map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="4" fill="${c}"/>`).join("")}</svg>`}
function donut(v,cs){const C=2*Math.PI*40,t=v.reduce((a,b)=>a+b,0);let o=0;return`<svg viewBox="0 0 100 100" width="125"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--bd)" stroke-width="14"/>${v.map((x,i)=>{const l=t?C*x/t:0,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${cs[i]}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`;o+=l;return s}).join("")}<text x="50" y="57" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">${t}</text></svg>`}
function EXEC(){const m=M(),g=gate(),ok=g.every(x=>x[1]),pass=g.filter(x=>x[1]).length,gp=Math.round(pass/g.length*100);
 const pc=[1,2,3,4].map(p=>m.op.filter(d=>pri(d)==p).length),pcol=["var(--er)","var(--wa)","var(--bl)","var(--mu)"];
 const dreT=[74,78,81,84,m.dre],opT=[9,8,7,5,m.op.length],ordT=[6,5,4,3,m.ord],rel=["2.0","2.1","2.2","2.3","2.4"];
 const risks=[];g.forEach(x=>{if(!x[1])risks.push(["",x[0]])});R.forEach(r=>{if(r.a.includes(2))risks.push(["",r.id+" has a stakeholder objection"])});IF.forEach(x=>{if(!x.p)risks.push(["",x.n+" contract test failing"])});rec().forEach(k=>{if(!CA.some(c=>c.cat==k||c.p.includes(k)))risks.push(["wa","Recurring cause: "+k+" – CAPA needed"])});
 const k=(t,v,a,c,d)=>`<div class="c"><div class="sp"><span class="m">${t}</span><span class="dl">${d}</span></div><b style="font-size:28px">${v}</b>${line(a,c)}<div class="m">Releases ${rel[0]} → ${rel[4]}</div></div>`;
 return`<div class="hero"><div><h2>Release 2.4.0 readiness</h2><span class="pill">${ok?"✔ GO":"✖ NO-GO"}</span><span class="pill">${pass}/${g.length} gate checks passed</span><span class="pill">${m.op.length} open defects</span><span class="pill">${m.p12} open P1/P2</span></div><div class="big">${gp}%</div></div>
 <div class="g2" style="margin-bottom:12px">${k("Defect removal efficiency",m.dre+"%",dreT,"var(--ok)","▲ improving")}${k("Open defects",m.op.length,opT,"var(--ac)","▼ falling")}${k("Order-data defects",m.ord,ordT,"var(--er)","▼ target 0")}</div>
 <div class="g2" style="margin-bottom:12px"><div class="c ctr"><h2>Gate readiness</h2>${ring(gp,col(gp),"release checks")}</div><div class="c ctr"><h2>Integration health</h2>${ring(m.ip,col(m.ip),"contract tests passing")}</div><div class="c ctr"><h2>Review completion</h2>${ring(m.rv,col(m.rv),"reviews done")}</div>
 <div class="c ctr"><h2>Open by priority</h2>${donut(pc,pcol)}<div class="m">${["P1","P2","P3","P4"].map((x,i)=>`<span style="color:${pcol[i]}">●</span> ${x}: ${pc[i]}`).join(" · ")}</div></div></div>
 <div class="g2" style="margin-bottom:12px"><div class="c"><h2>Component heat map (open defects)</h2><div class="heat">${COMP.map(x=>{const n=m.op.filter(d=>d.c==x).length;return`<div style="background:color-mix(in srgb,var(--er) ${Math.min(n*35,90)}%,var(--card))"><b>${n}</b>${x}</div>`}).join("")}</div></div>
 <div class="c"><h2>Stakeholder sign-off</h2>${SH.map((s,j)=>{const a=R.filter(r=>r.a[j]==1).length,p=Math.round(a/R.length*100);return`<div style="margin:7px 0"><div class="sp"><span>${s}</span><span class="m">${a}/${R.length}</span></div><div class="pg"><i style="width:${p}%;background:${col(p)}"></i></div></div>`}).join("")}</div></div>
 <div class="g2"><div class="c"><h2>Top quality risks</h2>${risks.slice(0,6).map(r=>`<div class="rk ${r[0]}">${r[1]}</div>`).join("")||"<div class='m'>No open risks 🎉</div>"}</div>
 <div class="c"><h2>CAPA pipeline</h2>${CP_ST.map((s,j)=>{const n=CA.filter(c=>c.st==j).length;return`<div class="sp" style="margin:5px 0"><span>${s}</span><span class="t ${n?"bl":""}">${n}</span></div>`}).join("")}<div class="m">Problem → Root cause → Corrective → Preventive → Verification → Improvement</div></div></div>`}
function rec(){const c={};D.forEach(d=>c[d.k]=(c[d.k]||0)+1);return Object.keys(c).filter(k=>c[k]>=2)}
function addD(){const t=$("#dt").value.trim();if(!t)return;D.push({id:D.length+1,t,c:$("#dc").value,s:+$("#ds").value,i:+$("#di").value,k:$("#dk").value,st:0,o:""});go()}
function adv(id){const d=D.find(x=>x.id==id);d.st++;if(d.st==2&&!d.o)d.o="Dev team";go()}
function chg(i){const x=CF[i];x.v=+(+x.v+0.1).toFixed(1)||x.v+"+";x.s="Under change";CH.push(`${x.n} → v${x.v}: change request raised, impact review pending`);go()}
function mk(k){CA.push({p:`Recurring defects: ${k}`,cat:k,rc:"",ca:"",pa:"",vf:"",im:"",st:0});go()}
function nx(i){const c=CA[i];const f=["rc","ca","pa","vf","im"][c.st];const v=prompt(`Enter ${CP_ST[c.st+1]} details:`);if(!v)return;c[f]=v;c.st++;go()}
function go(){$("#nav").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};go()">${t}</button>`).join("");$("#main").innerHTML=T[tab]()}
go();
</script></body></html>
